# nginx site config for https://www.kinnd.eu
# certbot adds the TLS lines (listen 443, certificates) on first run.

# kinnd.eu -> www.kinnd.eu
server {
    listen 80;
    listen [::]:80;
    server_name kinnd.eu;
    return 301 https://www.kinnd.eu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.kinnd.eu;

    root /var/www/kinnd-web/dist;
    index index.html;

    # Pages are folders with index.html; links end in a slash.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Hashed build assets and fonts never change: cache for a year.
    location ~* ^/(_astro|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # HTML: always revalidate so releases show up at once.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # nginx drops these in any location that sets its own add_header,
    # so they are repeated in the locations above.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
